<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2D5B"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#00AFC8"/>
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(40,40)">
    <!-- rear files -->
    <rect x="140" y="18" width="230" height="300" rx="34" fill="url(#gTeal)" transform="rotate(4 255 168)" opacity="0.95"/>
    <rect x="105" y="4" width="230" height="310" rx="34" fill="#1686D9" transform="rotate(-3 220 160)"/>
    <!-- main portal/file block -->
    <path d="M70 76 Q70 40 106 40 H286 Q322 40 322 76 V326 H255 V112 H137 V326 H70 Z" fill="url(#gBlue)"/>
    <!-- open door leaf -->
    <path d="M70 115 L166 72 L166 326 L70 281 Z" fill="#0B2D5B"/>
    <circle cx="148" cy="198" r="8" fill="#FFFFFF"/>
    <!-- document face -->
    <path d="M186 104 H271 Q286 104 286 119 V298 H186 Z" fill="#FFFFFF"/>
    <path d="M250 104 L286 140 H250 Z" fill="#EAF7FB"/>
    <rect x="206" y="168" width="58" height="11" rx="5.5" fill="url(#gTeal)"/>
    <rect x="206" y="195" width="58" height="11" rx="5.5" fill="#1686D9"/>
    <rect x="206" y="222" width="45" height="11" rx="5.5" fill="#1686D9"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(470,0)">
    <text x="425" y="230" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override"
          font-family="Noto Sans Arabic, Arial" font-size="98" font-weight="800" fill="#0B2D5B">بوابة المراسلات</text>
    <line x1="230" y1="286" x2="315" y2="286" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
    <text x="425" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="14" fill="#425B76">BAWABAT</text>
    <line x1="535" y1="286" x2="620" y2="286" stroke="#1686D9" stroke-width="6" stroke-linecap="round"/>
    <text x="425" y="365" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override"
          font-family="Noto Sans Arabic, Arial" font-size="29" font-weight="500" fill="#6B7280">المنصة الرقمية لتدبير وتتبع المراسلات الإدارية</text>
  </g>
</svg>
