<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mysteryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mysterySheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lockAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="diagonalHatch" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#334155" stroke-width="1.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>
  
  <!-- Base Tile -->
  <rect x="14" y="14" width="172" height="172" rx="42" fill="url(#mysteryBg)"/>
  <rect x="14" y="14" width="172" height="172" rx="42" fill="url(#diagonalHatch)"/>
  <rect x="14" y="14" width="172" height="172" rx="42" fill="none" stroke="url(#mysterySheen)" stroke-width="2.5"/>
  
  <!-- Shrouded / Covered Stealth Shield & Padlock -->
  <path d="M 100 44 C 134 44 152 52 152 78 C 152 116 122 146 100 158 C 78 146 48 116 48 78 C 48 52 66 44 100 44 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Centered Lock -->
  <!-- Shackle -->
  <path d="M 85 90 V 74 C 85 65.7 91.7 59 100 59 C 108.3 59 115 65.7 115 74 V 90" fill="none" stroke="url(#lockAccent)" stroke-width="5" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="76" y="90" width="48" height="38" rx="8" fill="#1e293b" stroke="url(#lockAccent)" stroke-width="2.5"/>
  <!-- Keyhole -->
  <circle cx="100" cy="105" r="4" fill="url(#lockAccent)"/>
  <path d="M 98 106 L 96 116 H 104 L 102 106 Z" fill="url(#lockAccent)"/>
  
  <!-- Subtle 'CONFIDENTIAL' label -->
  <text x="100" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="2">TOP SECRET</text>
</svg>
