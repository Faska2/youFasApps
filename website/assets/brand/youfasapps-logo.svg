<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="620" height="150">
  <defs>
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="50%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#0046E0"/>
    </linearGradient>
    <linearGradient id="fullSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00A3FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fullAppsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#006EFF" flood-opacity="0.3"/>
    </filter>
    <style>
      .full-wm-neutral { fill: #FFFFFF; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .full-wm-accent { fill: url(#fullAppsGrad); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .full-tagline { fill: #94A3B8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; letter-spacing: 0.8px; }
      @media (prefers-color-scheme: light) {
        .full-wm-neutral { fill: #07142F; }
        .full-tagline { fill: #64748B; }
      }
    </style>
  </defs>

  <!-- Symbol Group -->
  <g transform="translate(10, 10) scale(0.65)" filter="url(#fullGlow)">
    <rect x="12" y="12" width="176" height="176" rx="46" fill="url(#fullBg)"/>
    <rect x="12" y="12" width="176" height="176" rx="46" fill="none" stroke="url(#fullSheen)" stroke-width="2.5"/>
    <rect x="42" y="42" width="52" height="52" rx="14" fill="#FFFFFF"/>
    <rect x="106" y="42" width="52" height="52" rx="14" fill="#00E5FF"/>
    <rect x="42" y="106" width="52" height="52" rx="14" fill="#00E5FF"/>
    <path d="M 115 106 H 152 A 6 6 0 0 1 158 112 V 118 A 6 6 0 0 1 152 124 H 126 V 131 H 145 A 6 6 0 0 1 151 137 V 141 A 6 6 0 0 1 145 147 H 126 V 151 A 7 7 0 0 1 119 158 H 114 A 7 7 0 0 1 107 151 V 114 A 8 8 0 0 1 115 106 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="80" font-size="68" letter-spacing="-2">
    <tspan class="full-wm-neutral">youFas</tspan><tspan class="full-wm-accent">Apps</tspan>
  </text>

  <!-- Tagline -->
  <text x="164" y="118" font-size="21" class="full-tagline">
    Discover. Explore. Download.
  </text>
</svg>
